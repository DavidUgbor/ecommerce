build:
  system: docker
  min_cpu: 0.1
  max_cpu: 0.5
  min_memory: 512
  max_memory: 1024
dockerfile_path: Dockerfile
working_directory: /app/backend
build_context_directory: .
pre_build_command: ""
post_build_command: ""
start_command: npm run start
scaling:
  trigger: http_requests
  min_cpu: 0.05
  max_cpu: 0.25
  min_memory: 512
  max_memory: 1024
  min_replicas: 1
  max_replicas: 1
health_check:
  type: tcp
  interval_in_seconds: 60
cron_jobs: []
workers: []
review_apps:
  enabled: false
  ttl_days: 7
  inherit_worker_processes: true
  inherit_cron_jobs: true
